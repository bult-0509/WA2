services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Configure .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure .env first}
      POSTGRES_DB: ${POSTGRES_DB:?Configure .env first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - wemove-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  wemove-postgres:
